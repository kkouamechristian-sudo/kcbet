name: Mise a jour kcbet

on:
  schedule:
    - cron: "20 6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: kcbet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Calculer pronostics et resultats
        run: python pipeline/update.py
      - name: Enregistrer les donnees
        run: |
          git config user.name "kcbet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Mise a jour des pronostics et resultats"
          git push
      - name: Publier le site dans gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "kcbet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication du site"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
